# conda env for the road-closure prototype (CPU parts; LISFLOOD-FP is built separately by setup_lisflood.sh)
name: roadflood
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - requests
  - pygrib
  - pyproj
  - pillow
  - matplotlib
  - netcdf4
  - huggingface_hub
  - cmake
  - libnetcdf
  - numactl
