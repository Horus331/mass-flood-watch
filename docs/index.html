<meta charset="utf-8">
<title>Mass Flood Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed nautical-chart map; floating control card (left) and readout drawer (right); slim status bar on top. Stacks under the map on phones.
   Palette: chart-paper sea and land, MassDOT-style road hierarchy, a hazard ramp kept apart from the basemap hues. */
:root{
  --bg:#e9eef1; --panel:#ffffff; --panel2:#f5f7f8; --ink:#13222c; --muted:#5a6a75; --line:#d6dee3; --accent:#0d5d88; --accent-ink:#ffffff;
  --sea:#c3d9e6; --sea-edge:#a9c7d8; --land:#f3f2ee; --land-out:#e6e5df; --townline:#cbc6bb; --lake:#b7d3e3; --river:#93bed8;
  --road:#ffffff; --road-case:#c8c4ba; --art:#fff1bf; --art-case:#d6b45c; --hwy:#f6b45f; --hwy-case:#b4702a; --path:#cfcac0;
  --label:#2f3b44; --halo:#f3f2ee; --townlabel:#54493d; --water-label:#3f6f8e;
  --r1:#f2c14e; --r2:#e8833a; --r3:#c8322b; --r4:#7a1022; --deep:#1450a8; --shallow:#35a4d8; --flood-ring:#ffffff;
  --ok:#2f7d4f; --warn:#c77c11; --bad:#b3261e; --shadow:0 6px 24px rgba(15,35,50,.16);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a131a; --panel:#111c24; --panel2:#0e171e; --ink:#e2eaef; --muted:#93a5b1; --line:#23333e; --accent:#5fb3e3; --accent-ink:#06131b;
  --sea:#08121a; --sea-edge:#0e1d28; --land:#17222b; --land-out:#121b22; --townline:#2b3a45; --lake:#0c1c28; --river:#1b3a50;
  --road:#2d3b47; --road-case:#0c141b; --art:#4b4733; --art-case:#1b1d15; --hwy:#8a6430; --hwy-case:#2b1e0e; --path:#2a3640;
  --label:#c7d3db; --halo:#17222b; --townlabel:#a3b3bf; --water-label:#6ea3c4;
  --r1:#e9c25a; --r2:#f0924a; --r3:#ff5c4d; --r4:#ff9aa8; --deep:#3d8cff; --shallow:#5fd0ff; --flood-ring:#08121a;
  --ok:#5cc28a; --warn:#e7a94a; --bad:#ff6b5e; --shadow:0 6px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a131a; --panel:#111c24; --panel2:#0e171e; --ink:#e2eaef; --muted:#93a5b1; --line:#23333e; --accent:#5fb3e3; --accent-ink:#06131b;
  --sea:#08121a; --sea-edge:#0e1d28; --land:#17222b; --land-out:#121b22; --townline:#2b3a45; --lake:#0c1c28; --river:#1b3a50;
  --road:#2d3b47; --road-case:#0c141b; --art:#4b4733; --art-case:#1b1d15; --hwy:#8a6430; --hwy-case:#2b1e0e; --path:#2a3640;
  --label:#c7d3db; --halo:#17222b; --townlabel:#a3b3bf; --water-label:#6ea3c4;
  --r1:#e9c25a; --r2:#f0924a; --r3:#ff5c4d; --r4:#ff9aa8; --deep:#3d8cff; --shallow:#5fd0ff; --flood-ring:#08121a;
  --ok:#5cc28a; --warn:#e7a94a; --bad:#ff6b5e; --shadow:0 6px 28px rgba(0,0,0,.5); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;position:relative}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.05}
h1{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.06em;margin:0;text-transform:uppercase}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;flex-wrap:wrap}
.tab{font:600 12.5px var(--body);padding:6px 9px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:1480px){.clock{display:none}}
.livechip{display:flex;align-items:center;gap:8px;font:500 12.5px var(--body);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;background:var(--panel2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;color:inherit;opacity:0;animation:ping 2.4s infinite}
.dot.ok{color:var(--ok)} .dot.warn{background:var(--warn);color:var(--warn)} .dot.bad{background:var(--bad);color:var(--bad)}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.1);opacity:0}}
.clock{font:500 12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:600 12.5px var(--body);padding:6px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.tab:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-height:0;background:var(--sea);overflow:hidden}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#map:active{cursor:grabbing}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3}
.rail{left:max(14px,env(safe-area-inset-left,0px));top:14px;width:292px;max-height:calc(100% - 28px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.readout{right:max(14px,env(safe-area-inset-right,0px));top:14px;width:356px;max-height:calc(100% - 112px);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.legend{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:9px 11px;font-size:12px;display:flex;flex-direction:column;gap:5px;max-width:300px}
.legend b{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mapctl{position:absolute;right:calc(386px + env(safe-area-inset-right,0px));top:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font:600 17px var(--body);cursor:pointer;box-shadow:var(--shadow)}
.scalebar{position:absolute;right:calc(386px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.scalebar .bar{height:7px;border:1.5px solid var(--ink);border-top:0;font:500 11px var(--mono);color:var(--ink);position:relative}
.scalebar .bar span{position:absolute;bottom:9px;right:0;white-space:nowrap;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.north{width:26px;height:34px}
.byline{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;width:356px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.byline .logo{flex:none;height:40px;display:flex;align-items:center}
.byline .logo svg{height:40px;width:auto;display:block}
.byline .logo .wm{fill:var(--ink)}
.byline .who{font-weight:650;font-size:14px;color:var(--ink);line-height:1.2}
.byline .what{font-size:11.5px;color:var(--muted);line-height:1.35}
.app.present .byline{right:max(18px,env(safe-area-inset-right,0px))}
.credit{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(2px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--muted);z-index:2;pointer-events:none;text-shadow:0 0 3px var(--halo)}
.lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:6px}
.wplay{display:flex;gap:8px;align-items:center}.wplay .btn{min-width:74px}.wtime{font:600 15px var(--mono);letter-spacing:.02em}
.wchart{width:100%;height:120px;display:block;margin-top:4px}.wchart text{font:10px var(--mono);fill:var(--muted)}
select,input[type=range],input[type=search]{width:100%}
select,input[type=search]{font:14px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
input[type=range]{accent-color:var(--accent)}
.val{font-family:var(--mono);font-size:13px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.engine{font:500 11.5px var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.engine b{color:var(--ok);font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;max-width:270px;box-shadow:var(--shadow);z-index:6}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}
.sw.dotsw{border-radius:50%;box-shadow:0 0 0 1.5px var(--flood-ring) inset}
.ramp{display:flex;gap:0;margin-top:2px}.ramp span{flex:1;height:9px}.ramp span:first-child{border-radius:3px 0 0 3px}.ramp span:last-child{border-radius:0 3px 3px 0}
.rampl{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:600 24px var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:4px}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-family:var(--mono)}
tr.go{cursor:pointer} tr.go:hover td{background:var(--panel2)}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font:600 11px var(--body);border:1px solid currentColor;white-space:nowrap}
.p-ok{color:var(--ok)} .p-warn{color:var(--warn)} .p-bad{color:var(--bad)}
.gauges{display:flex;flex-direction:column;gap:8px}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.g h4{margin:0;font:600 14px var(--body)} .g .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);grid-column:1/-1}
.g svg{grid-column:1/-1;width:100%;height:66px;display:block}
ul{margin:0;padding-left:18px}
h2{font-family:var(--display);font-size:21px;font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.empty{color:var(--muted);font-style:italic}
.gmark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);z-index:2;pointer-events:none}
.gmark::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ping 2.8s infinite}
.gmark.warn{background:var(--warn)} .gmark.warn::after{border-color:var(--warn)} .gmark.bad{background:var(--bad)} .gmark.bad::after{border-color:var(--bad)}
.titlecard{left:max(18px,env(safe-area-inset-left,0px));top:18px;padding:14px 18px;max-width:520px}
.titlecard h3{font:700 30px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.titlecard p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.titlecard .kick{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;background:var(--sea);font:500 13px var(--mono);color:var(--muted)}
.app.present{grid-template-rows:1fr}
.app.present header,.app.present .rail,.app.present .readout,.app.present .mapctl{display:none}
.app.present .scalebar{right:max(18px,env(safe-area-inset-right,0px))}
.app.present .legend{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.exitpresent{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;z-index:4;opacity:.25}
.exitpresent:hover,.exitpresent:focus-visible{opacity:1}
@media (max-width:1100px){.readout{width:320px}.byline{width:320px}.mapctl,.scalebar{right:calc(350px + env(safe-area-inset-right,0px))}}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  header{gap:10px}.status{margin-left:0}
  .stage{height:auto;flex:none;overflow:visible;padding-top:64vh;display:flex;flex-direction:column}
  canvas#map{height:64vh;bottom:auto}
  .scalebar{bottom:auto;top:calc(64vh - 116px)} .credit{bottom:auto;top:calc(64vh - 15px)} .byline{bottom:auto;top:calc(64vh - 76px);width:auto;max-width:calc(100% - 24px);padding:6px 10px} .byline .logo svg{height:28px} .byline .who{font-size:12.5px}
  .legend{position:static;max-width:none;box-shadow:none;border-radius:0;border-left:0;border-right:0;order:-1}
  .rail,.readout{position:static;width:auto;max-height:none;box-shadow:none;border-radius:0;border-left:0;border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mapctl,.scalebar,.byline{right:max(12px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header>
    <div class="brand"><h1>Mass Flood Watch</h1><small>Road flooding from rain and the sea · MassDOT Districts 3–6</small></div>
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" data-mode="live" aria-pressed="true" id="t-live">Live now</button>
      <button class="tab" data-mode="coastal" aria-pressed="false" id="t-coastal">Coastal</button>
      <button class="tab" data-mode="inland" aria-pressed="false" id="t-inland">Rain</button>
      <button class="tab" data-mode="traffic" aria-pressed="false" id="t-traffic">Traffic</button>
      <button class="tab" data-mode="future" aria-pressed="false" id="t-future">Long-term</button>
      <button class="tab" data-mode="tsunami" aria-pressed="false" id="t-tsunami">Tsunami</button>
      <button class="tab" data-mode="graph" aria-pressed="false" id="t-graph">Road graph</button>
      <button class="tab" data-mode="water" aria-pressed="false" id="t-water">Water</button>
      <button class="tab" data-mode="check" aria-pressed="false" id="t-check">Model check</button>
    </div>
    <div class="status">
      <span class="livechip" id="livechip"><span class="dot ok" id="livedot"></span><span id="livetxt">Loading…</span></span>
      <span class="clock" id="clock"></span>
      <button class="btn" id="present">Presentation view</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="map" aria-label="Map of Massachusetts roads, towns and flood model results"></canvas>
    <div id="gmarks"></div>
    <aside class="card rail" aria-label="Controls">
      <div class="ctl"><label class="lbl" for="find">Go to a town</label><input type="search" id="find" list="townlist" placeholder="e.g. Quincy" autocomplete="off"><datalist id="townlist"></datalist></div>
      <div id="controls"></div>
      <div class="ctl"><span class="lbl">How to read it</span><p class="note" id="howto"></p></div>
      <div class="engine" id="engine"></div>
    </aside>
    <aside class="card readout" aria-label="Results" id="readout"></aside>
    <div class="mapctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⌂</button></div>
    <div class="card legend" id="legend"></div>
    <div class="scalebar"><svg class="north" viewBox="0 0 26 34" aria-hidden="true"><path d="M13 2 L21 28 L13 22 L5 28 Z" fill="var(--ink)"/><path d="M13 2 L13 22 L5 28 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="13" y="34" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="8" font-weight="600" fill="var(--ink)">N</text></svg><div class="bar" id="scale"><span></span></div></div>
    <div class="byline" id="byline"><div class="logo" id="wpilogo" role="img" aria-label="WPI logo"></div><div><div class="who">Mohab Eldokla</div><div class="what">PhD in Civil Engineering<br>Graduation project · Worcester Polytechnic Institute</div></div></div>
    <div class="credit">Roads: MassGIS/MassDOT · Water: USGS NHD · Towns: MassGIS · Model: Mohab Eldokla, WPI</div>
    <div class="card titlecard" id="titlecard" hidden><div class="kick" id="tc-kick"></div><h3 id="tc-title"></h3><p id="tc-sub"></p></div>
    <button class="btn exitpresent" id="exitpresent" hidden>Exit presentation (Esc)</button>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">Loading map data…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function(){
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
fetch('wpi-logo.svg').then(r => r.ok ? r.text() : '').then(t => { if (t.includes('<svg')) document.getElementById('wpilogo').innerHTML = t; else document.getElementById('wpilogo').remove(); }).catch(() => document.getElementById('wpilogo')?.remove());
const getJSON = async u => { const r = await fetch(u, {cache: u.startsWith('live') ? 'no-store' : 'default'}); if (!r.ok) throw new Error(u); return r.json(); };
let D, BM, TW, WA, NB, MAN = {tiles:[]};
try {
  [D, BM, TW, WA, NB] = await Promise.all(['data.json','major.json','towns.json','water.json','neighbors.json'].map(getJSON));
} catch(e){ $('#loading').textContent = 'Map data could not be loaded. Refresh the page; if it keeps happening, a data file is missing from the published page.'; return; }
performance.mark('fetched'); try { MAN = await getJSON('manifest.json'); } catch(e){}
try { const L = await getJSON('live.json'); if (L && L.asof) D.live = L; } catch(e){}

/* ================= projection: world = (lon, -mercator(lat)) in degrees ================= */
const RAD = Math.PI/180, mY = lat => -Math.log(Math.tan(Math.PI/4 + lat*RAD/2))/RAD, iY = y => (2*Math.atan(Math.exp(-y*RAD)) - Math.PI/2)/RAD;
const [OX, OY, Q] = BM.origin;
function decode(arr, start){ const n = (arr.length - start)/2, out = new Float32Array(n*2); let x=0, y=0;
  for (let i=0;i<n;i++){ x += arr[start+2*i]; y += arr[start+2*i+1]; out[2*i] = OX + x/Q; out[2*i+1] = mY(OY + y/Q); } return out; }
function addLine(p, c){ p.moveTo(c[0], c[1]); for (let i=2;i<c.length;i+=2) p.lineTo(c[i], c[i+1]); }
function addRing(p, c){ addLine(p, c); p.closePath(); }
const VIEW0 = [-72.35, mY(42.88), -69.9, mY(41.22)];

/* ================= build basemap geometry ================= */
const G0 = {};
G0.neigh = new Path2D(); for (const pl of NB.polys) addRing(G0.neigh, decode(pl.r, 0));
G0.land = new Path2D(); const townGeo = new Map();
for (const t of TW.towns){ const p = new Path2D(); let bb=[1e9,1e9,-1e9,-1e9];
  for (const poly of t.p) for (const ring of poly){ const c = decode(ring, 0); addRing(p, c); for (let i=0;i<c.length;i+=2){ bb[0]=Math.min(bb[0],c[i]); bb[2]=Math.max(bb[2],c[i]); bb[1]=Math.min(bb[1],c[i+1]); bb[3]=Math.max(bb[3],c[i+1]); } }
  townGeo.set(t.n, {path:p, bb, label:[t.l[0], mY(t.l[1])], area:t.a}); }

function tideChart(k, g){ const cv = g.curve; if (!cv || !cv.pred || !cv.pred.length) return '';
  const n = cv.pred.length, t0 = Date.parse(cv.t0), now = Date.now(), gi = GA[k]||{};
  const vals = cv.pred.concat(cv.obs.filter(v=>v!=null), (cv.stofs||[]).filter(v=>v!=null)); const yr = gi.mu; let lo = Math.min(...vals), hi = Math.max(...vals, yr!=null? yr+0.05 : -9);
  const w = 300, h = 66, pad = 4, X = i => pad + (w-2*pad)*i/(n-1), Y = v => h-12 - (h-20)*(v-lo)/((hi-lo)||1);
  const line = arr => arr.map((v,i)=> v==null? null : [X(i),Y(v)]).reduce((s,p,i,a)=> p? s + (i && a[i-1]? 'L':'M') + p[0].toFixed(1)+','+p[1].toFixed(1) : s, '');
  const nowI = (now - t0)/3.6e6; const nx = nowI>=0 && nowI<=n-1 ? X(nowI) : null;
  const area = 'M'+X(0)+','+(h-12)+' '+cv.pred.map((v,i)=>'L'+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+' L'+X(n-1)+','+(h-12)+'Z';

    <path d="${line(cv.pred)}" fill="none" stroke="${C.muted}" stroke-width="1.2" stroke-dasharray="2 2"/>
    ${cv.stofs? `<path d="${line(cv.stofs.map((v,i)=> i>=nowI-1? v : null))}" fill="none" stroke="${C.r3}" stroke-width="1.6"/>` : ''}
    <path d="${line(cv.obs)}" fill="none" stroke="${C.accent}" stroke-width="2"/>
    ${nx!=null? `<line x1="${nx}" x2="${nx}" y1="2" y2="${h-12}" stroke="${C.ink}" stroke-width="1" opacity=".5"/><text x="${nx+3}" y="${h-2}" font-size="9" fill="${C.muted}" font-family="IBM Plex Mono,monospace">now</text>`:''}
    <text x="${pad}" y="${h-2}" font-size="9" fill="${C.muted}" font-family="IBM Plex Mono,monospace">−26 h</text><text x="${w-pad}" y="${h-2}" text-anchor="end" font-size="9" fill="${C.muted}" font-family="IBM Plex Mono,monospace">+48 h</text></svg>`; }

const VI = (D.validation||{}).inland||{}, VC = (D.validation||{}).coastal||{};
/* ---------- model check ---------- */
function ciBars(rows, lo=0.6, hi=1){ const w=320, rh=30, h=rows.length*rh+30, x=v=>110+(w-120)*(v-lo)/(hi-lo);
  const ticks=[0.4,0.5,0.6,0.7,0.8,0.9,1.0].filter(t=>t>=lo&&t<=hi);
  return `<svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;aspect-ratio:${w}/${h};flex:none" role="img" aria-label="AUC with 95% ranges">${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${h-16}" stroke="${C.muted}" stroke-opacity=".25"/><text x="${x(t)}" y="${h-4}" font-size="9" text-anchor="middle" fill="${C.muted}" font-family="IBM Plex Mono,monospace">${t.toFixed(1)}</text>`).join('')}
  ${rows.map((r,i)=>{ const y=i*rh+22; return `<text x="0" y="${y+4}" font-size="10.5" fill="${C.ink}" font-family="IBM Plex Sans,sans-serif">${r[0]}</text>${r[2]?`<line x1="${x(r[2][0])}" x2="${x(r[2][1])}" y1="${y}" y2="${y}" stroke="${r[3]||C.accent}" stroke-width="3" stroke-opacity=".45" stroke-linecap="round"/>`:''}<circle cx="${x(r[1])}" cy="${y}" r="4.5" fill="${r[3]||C.accent}"/><text x="${x(r[1])}" y="${y-8}" font-size="9.5" text-anchor="middle" fill="${C.ink}" font-family="IBM Plex Mono,monospace">${r[1].toFixed(3)}</text>`; }).join('')}</svg>`; }
function relPlot(pts, maxv){ const w=300, h=210, m=34, X=v=>m+(w-m-10)*Math.sqrt(v/maxv), Y=v=>h-m+((m+6)-(h-m))*Math.sqrt(v/maxv), tk=[0.01,0.05,0.2,0.5].filter(t=>t<=maxv);
  return `<svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;aspect-ratio:${w}/${h};flex:none" role="img" aria-label="Predicted against observed flood rate"><line x1="${X(0)}" y1="${Y(0)}" x2="${X(maxv)}" y2="${Y(maxv)}" stroke="${C.muted}" stroke-dasharray="4 3"/>
  ${tk.map(t=>`<text x="${X(t)}" y="${h-m+14}" font-size="9" text-anchor="middle" fill="${C.muted}" font-family="IBM Plex Mono,monospace">${Math.round(t*100)}%</text><text x="${m-4}" y="${Y(t)+3}" font-size="9" text-anchor="end" fill="${C.muted}" font-family="IBM Plex Mono,monospace">${Math.round(t*100)}%</text>`).join('')}
  <text x="${(w+m)/2}" y="${h-4}" font-size="9.5" text-anchor="middle" fill="${C.muted}" font-family="IBM Plex Sans,sans-serif">model said</text><text x="10" y="${(h-m)/2}" font-size="9.5" text-anchor="middle" fill="${C.muted}" font-family="IBM Plex Sans,sans-serif" transform="rotate(-90 10 ${(h-m)/2})">really happened</text>
  ${pts.map(p=>`<circle cx="${X(Math.min(p.p,maxv))}" cy="${Y(Math.min(p.o,maxv))}" r="${3+Math.min(6,Math.log10(p.n))}" fill="${p.c}" fill-opacity=".8" stroke="${C.panel}"/>`).join('')}</svg>`; }
function mCheck(){
  layer = {townFill: n=>{ const p=tprops.get(n); if (!p) return null; return String(p.district)==='3' ? C.shallow : C.accent; }, townTip: n=>{ const p=tprops.get(n); return `<b>${titleCase(n)}</b><br>${p? (String(p.district)==='3'?'District 3: used as an unseen test region, then added to training':'Districts 4–6: original training region') : 'outside the model area'}`; }};
  legend(`<b>Rain model coverage</b><div><span class="sw" style="background:${C.accent}"></span>Districts 4–6 (original training)</div><div><span class="sw" style="background:${C.shallow}"></span>District 3 (tested blind, then added)</div>`);
  $('#controls').innerHTML = `<p class="note">Every score here comes from leave-one-year-out testing: the model is trained without a year, then scored on that year, for every year. Ranges are 95% bootstrap intervals over storm days.</p>`;
  $('#howto').textContent = 'AUC is the chance the model ranks a real flood above a non-flood (0.5 = coin flip, 1 = perfect). The reliability chart checks whether a forecast of X% comes true X% of the time: dots on the dashed line are perfectly calibrated.';
  engine('Validation numbers computed overnight in Colab from the saved training tables');
  const rc = (VI.reliability_combined||[]).map(r=>({p:r.predicted,o:r.observed,n:r.n,c:C.accent})), rco = (VC.reliability||[]).map(r=>({p:r[2],o:r[3],n:r[1],c:C.r2}));

  $('#readout').innerHTML = `<h2>How good is it?</h2>
   <span class="lbl">Rain flooding · town-days ${fmt((VI.combined_all||{}).rows)} tested, ${fmt((VI.combined_all||{}).floods)} with a flood</span>
   ${ciBars([['Districts 4–6', (VI.east_D46||{}).AUC||0, (VI.east_D46||{}).AUC_95CI], ['District 3, never seen', (VI.transfer_D3||{}).AUC||0, (VI.transfer_D3||{}).AUC_95CI, C.shallow], ['All, combined model', (VI.combined_all||{}).AUC||0, (VI.combined_all||{}).AUC_95CI]])}
   <p class="note">Trained only on Districts 4–6, the model ranked floods in District 3 towns as well as at home. The map now uses one model trained on all four districts.</p>
   <span class="lbl">Coastal flooding · ${fmt(VC.zone_days)} zone-days, ${fmt(VC.reports)} with NOAA reports</span>
   ${ciBars(cm.filter(r=>r[1]==='lr'||r[0].includes('waves')).map(r=>[r[0].replace(' (current)','')+(r[1]==='trees'?' (trees)':''), r[2], r[3], r[0].includes('waves')?C.r2:C.accent]), 0.6, 1)}
   <p class="note">Adding the day's biggest offshore wave height (NOAA buoys) lifts the score from ${sy.lr?sy.lr[0]:'–'} to ${sy.lr?sy.lr[1]:'–'} on the same ${sy.years||''} days. Waves alone score ${sy.waves_alone||'–'}.</p>
   <span class="lbl">Reliability · does X% happen X% of the time?</span>
   ${relPlot(rc.concat(rco), 0.7)}
   <p class="note"><span class="sw" style="background:${C.accent}"></span>rain model &nbsp; <span class="sw" style="background:${C.r2}"></span>coastal model (with waves). Bigger dots = more days.</p>
   <span class="lbl">Checked against USGS high-water marks</span>
   <div class="stats"><div class="stat"><b>${hw.detection_2018_01?hw.detection_2018_01[0]+' of '+hw.detection_2018_01[1]:'–'}</b><span>Jan 2018 marks near roads (water above the road surface) where the model had the road under water</span></div><div class="stat"><b>+${fmt((hw.local_minus_gauge_m||{}).median,2)} m</b><span>median: water at the marks above water at the nearest tide gauge (waves and wind push)</span></div></div>
   <p class="note">${fmt(hw.marks)} USGS marks in eastern Massachusetts from 6 storms (1978–2018). The road check uses the January 2018 nor'easter, the one storm both on the map's replay list and surveyed by USGS. Marks only exist where water was, so this measures misses, not false alarms.</p>${checkExtra()}`;
}
function checkExtra(){ const VR=(D.validation||{}).roads; let s='';
  if (VR) s += `<span class="lbl">Which roads in a town flood first · ${fmt(VR.town_days)} flooded town-days</span>
   ${ciBars([['Lowest roads first', VR.baseline||0.5, null, C.muted], ['Road model', VR.mean_auc||0.5, VR.ci||null, C.r2]], 0.4, 1)}
   <div class="stats"><div class="stat"><b>${Math.round((VR.share_top10||0)*100)}%</b><span>of reported flooded roads were in the model's top 10% of that town's roads</span></div></div>
   <p class="note">Each road piece was scored from lidar terrain: how low it sits compared with roads around it (250 m and 600 m) and within its town. It beats "lowest roads first" but is <b>not shown on the map yet</b>: many top-ranked streets sit on hills, a sign that report locations (often placed at a town centre or a crossroads) are too rough to teach street-level detail. Needs exact flood locations (311 calls, MassDOT closure logs) before it can be trusted.</p>`;

  if ($('#wtime')) $('#wtime').textContent = st.showMax ? 'Highest water, whole storm' : etFmt(simTime(m, st.f));
  if ($('#wbar') && document.activeElement !== $('#wbar')) $('#wbar').value = Math.round(st.f * 20);
  if ($('#ws1')){ $('#ws1').textContent = isF ? `${fmt(fr.rain_max_mmph, 0)} mm/h` : `${fmt(fr.level_navd_m, 2)} m`; $('#ws1l').textContent = isF ? 'heaviest rain this hour (MRMS radar)' : 'Boston tide gauge, NAVD88';
    $('#ws2').textContent = `${fmt(show.wet_km2, 1)} km²`; $('#ws3').textContent = `${fmt(show.deep_km2, 1)} km²`; $('#ws4').textContent = show.roads_wet == null ? '–' : fmt(show.roads_wet); }
  const cur = $('#wcur'); if (cur){ const x = 30 + 240 * st.f / (m.n - 1); cur.setAttribute('x1', x); cur.setAttribute('x2', x); }
  scheduleDraw(true); }
function wStart(){ const st = state.water, m = WSIM[st.id]; if (!m) return; if (st.f >= m.n - 1.01) st.f = 0; st.showMax = false; if ($('#wmax')) $('#wmax').checked = false;
  $('#wplay').textContent = '❚❚ Pause'; let last = performance.now();
  const tickW = now => { if (!wTimer) return; const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const k = Math.floor(st.f); const nextOk = okImg(m.img[Math.min(k + 1, m.n - 1)]);   // wait for frames that are still loading
    if (nextOk) st.f = Math.min(m.n - 1, st.f + dt * st.speed);
    wUpdate(); if (st.f >= m.n - 1){ wStop(); return; } wTimer = requestAnimationFrame(tickW); };
  wTimer = requestAnimationFrame(tickW); }
function wStop(){ if (wTimer) cancelAnimationFrame(wTimer); wTimer = 0; const b = $('#wplay'); if (b) b.textContent = '▶ Play'; }
const MODES = {water:mWater, graph:mGraph, check:mCheck, live:mLive, coastal:mCoastal, inland:mInland, traffic:mTraffic, future:mFuture, tsunami:mTsunami};
function setMode(m){ if (!MODES[m]) m = 'live'; if (m !== 'water' && typeof wStop === 'function') wStop(); state.mode = m; try{ history.replaceState(null, '', '#' + m); }catch(e){} try{ localStorage.setItem('mfw-mode', m); }catch(e){}
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===m))); $('#gmarks').innerHTML=''; tip.hidden = true; MODES[m](); scheduleDraw(true); }
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* ================= live status bar ================= */
function liveStatus(){ const L = D.live; if (!L){ $('#livetxt').textContent = 'No live data yet'; return; }
  const m = /(\d{4}-\d\d-\d\d) (\d\d):(\d\d)/.exec(L.asof||''); let ago = '';
  if (m){ const off = new Date().toLocaleString('en-US',{timeZone:'America/New_York',timeZoneName:'shortOffset'}).match(/GMT([+-]\d+)/); const tz = off? (+off[1]) : -4;
    const t = Date.parse(`${m[1]}T${m[2]}:${m[3]}:00${tz<0?'-':'+'}${String(Math.abs(tz)).padStart(2,'0')}:00`); const h = (Date.now()-t)/3.6e6;
    ago = h < 1 ? `${Math.max(1,Math.round(h*60))} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h/24)} days ago`; }
  const g = Object.values(L.gauges||{}); const minA = Math.min(1, ...g.map(x=>x.aep)); const alerts = (L.alerts||[]).length;
  const level = minA <= 0.2 || alerts ? (minA <= 0.02 ? 'bad' : 'warn') : 'ok';
  $('#livedot').className = 'dot ' + level;
  $('#livetxt').textContent = `${level==='ok'?'Calm':level==='warn'?'Watch':'Flooding likely'} · updated ${ago || L.asof}`;
  $('#livechip').title = `Data refreshed automatically each morning (${L.asof}). Sources: NOAA tide gauges, NWS forecast grid, NWS alerts, NTWC.`; }
function tick(){ $('#clock').textContent = new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York', hour:'numeric', minute:'2-digit', second:'2-digit'}) + ' ET'; }
setInterval(tick, 1000); tick(); setInterval(liveStatus, 60000);

/* ================= presentation view ================= */
function present(on){ $('#app').classList.toggle('present', on); $('#titlecard').hidden = !on; $('#exitpresent').hidden = !on; setTimeout(()=>{ resize(); }, 30); }
$('#present').onclick = ()=>present(true); $('#exitpresent').onclick = ()=>present(false);
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#app').classList.contains('present')) present(false); });

/* ================= start ================= */
performance.mark('before-start'); readColors(); liveStatus();
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ readColors(); setMode(state.mode); });
new MutationObserver(()=>{ readColors(); setMode(state.mode); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
resize(); setMode(MODES[state.mode]? state.mode : 'live');
$('#loading').hidden = true; performance.mark('ready'); setTimeout(()=>{ buildWater(); performance.mark('water'); }, 60);
})();
</script>
