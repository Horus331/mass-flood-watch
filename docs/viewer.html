<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Replay · Mass Flood Watch</title>
<meta name="description" content="Replay of a modelled flash flood and the road segments it closes in MassDOT Highway District 3. PhD research prototype, Worcester Polytechnic Institute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="site/viewer.css" rel="stylesheet">
<script>try{var t=localStorage.getItem('mfw-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="map" aria-label="Map of modelled flood depth and road closures"></div>

<section class="card" id="card" aria-labelledby="runTitle">
  <a class="brand" href="./" title="Mass Flood Watch home"><img src="wpi-logo.svg" alt="WPI" width="62" height="20"><span>Mass Flood Watch</span></a>
  <div class="runs" role="tablist" aria-label="Storm">
    <a role="tab" data-run="leominster_sep2023" href="?run=leominster_sep2023">Leominster 2023</a>
    <a role="tab" data-run="worcester_aug2021" href="?run=worcester_aug2021">Worcester 2021</a>
    <a role="tab" data-run="d3_sep2023" href="?run=d3_sep2023">All of District 3</a>
  </div>
  <h1 id="runTitle"></h1>
  <p class="kind" id="runKind"></p>
  <p class="stats" id="runStats"></p>
</section>

<section class="legend" id="legend" aria-label="Map layers">
  <button class="legend-toggle" id="legendToggle" aria-expanded="true" aria-controls="legendBody">Layers</button>
  <div id="legendBody">
    <label class="row"><input type="checkbox" id="lyDepth" checked><span>Flood depth</span></label>
    <div class="ramp" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i></div>
    <div class="ramp-labels" aria-hidden="true"><span>5</span><span>15</span><span>30</span><span>100 cm</span></div>
    <label class="row"><input type="checkbox" id="lyClosed" checked><span><i class="sw closed"></i>Closed now (30 cm or more on the road)</span></label>
    <label class="row"><input type="checkbox" id="lyPeak" checked><span><i class="sw peak"></i>Closes at some point in the storm</span></label>
    <label class="row"><input type="checkbox" id="lyMay" checked><span><i class="sw may"></i>May close: stream reaches road level</span></label>
    <label class="row" id="riskRow" hidden><input type="checkbox" id="lyRisk"><span>Risk class</span></label>
    <div class="riskkey" id="riskKey" hidden><span><i class="sw rx"></i>Extreme</span><span><i class="sw rh"></i>High</span><span><i class="sw rm"></i>Medium</span><span><i class="sw rl"></i>Low</span></div>
  </div>
</section>

<section class="player" aria-label="Storm timeline">
  <div class="loading" id="loading" role="status" aria-live="polite"><div class="bar"><i id="loadBar"></i></div><span id="loadText">Loading storm…</span></div>
  <div class="controls">
    <button id="play" class="play" disabled aria-label="Play storm"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="playIcon" d="M5 3l12 7-12 7z"/></svg></button>
    <div class="speeds" role="group" aria-label="Playback speed">
      <button data-speed="1">1×</button><button data-speed="2" aria-pressed="true">2×</button><button data-speed="4">4×</button>
    </div>
    <div class="clock"><b id="clock">–</b><span id="since"></span></div>
    <div class="now"><b id="nClosed">–</b><span>segments closed</span></div>
  </div>
  <div class="timeline">
    <svg id="chart" preserveAspectRatio="none" aria-hidden="true"></svg>
    <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Storm time">
    <div class="axis" aria-hidden="true"><span><i class="sw rain"></i>Rain, box average (mm/h)</span><span><i class="sw line"></i>Segments closed</span></div>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="site/viewer.js"></script>
</body>
</html>
