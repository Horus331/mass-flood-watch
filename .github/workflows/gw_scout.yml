name: Groundwater scouting (USGS wells, District 3)
on:
  workflow_dispatch:
    inputs:
      script: {description: 'proto script', default: 'gw_scout.py'}
permissions:
  contents: write
env:
  API_USGS_PAT: ${{ secrets.USGS_API_KEY }}   # free USGS Water Data key (higher rate limit); never printed
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests scipy numpy pyproj huggingface_hub tifffile pillow
      - run: python proto/${{ inputs.script }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: |
          git config user.name 'github-actions'; git config user.email 'actions@github.com'
          git add docs/proto/groundwater papers/paper2 docs/how-it-works/sketch docs/proto/phase1/fig; git commit -qm "groundwater scouting data" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
