name: Slide images (static GIS maps from the ArcGIS layer and cascade output, live-site screenshots), run by hand
on:
  workflow_dispatch:
    inputs:
      what: {description: 'maps | site | both', default: 'both'}
permissions:
  contents: write
jobs:
  maps:
    if: inputs.what != 'site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "tools\ndocs/proto/arcgis\ndocs/site/data/leominster_sep2023", sparse-checkout-cone-mode: true}
      - run: pip install -q geopandas contextily matplotlib pandas numpy shapely pyogrio
      - run: python tools/slide_shots.py maps
      - name: push the images to branch slide-maps (orphan, replaced each run)
        run: |
          cd shots && git init -q -b slide-maps && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "slide images (maps)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:slide-maps
  site:
    if: inputs.what != 'maps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: tools, sparse-checkout-cone-mode: true}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python tools/slide_shots.py site
      - name: push the images to branch slide-site (orphan, replaced each run)
        run: |
          cd shots && git init -q -b slide-site && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "slide images (site)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:slide-site
