name: National Inventory of Dams for Massachusetts (run by hand)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests && python sim/dams_fetch.py
      - if: always()
        run: |
          git config user.name "flood-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/network/dams_ma*.json || true; git commit -qm "data: NID dams for Massachusetts" || exit 0
          for i in $(seq 1 10); do git pull -q --rebase && git push -q && break; sleep 10; done
