name: Water movement simulation (run by hand)
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Scenarios as a JSON list, e.g. ["forecast"]'
        default: '["flash","boston","southshore","coastal"]'
      forecast_min_mm:
        description: 'Rain threshold for the forecast scenario (0 = always simulate, for testing)'
        default: '20'
permissions:
  contents: write
concurrency:
  group: water-${{ github.ref }}-${{ github.event.inputs.only }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      FORECAST_MIN_MM: ${{ github.event.inputs.forecast_min_mm || '20' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event.inputs.only || '["flash","boston","southshore","coastal"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - run: pip install -r sim/requirements.txt
      - name: Simulate ${{ matrix.scenario }}
        run: python sim/water_sim.py ${{ matrix.scenario }}
      - name: Commit frames
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/sim/${{ matrix.scenario }}
          git diff --cached --quiet && exit 0
          git commit -m "Water simulation: ${{ matrix.scenario }} frames $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in $(seq 1 15); do git pull --rebase -q origin main && git push && break; sleep $((RANDOM % 20 + i * 3)); done
