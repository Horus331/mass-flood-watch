name: Observed-rain trigger test (pre-registered, docs/proto/forecast/OBS_TRIGGER_PREREG.md)
# Run once as frozen. Storms: M1 timing + M2 placement (HRRR boxes for the 4 storms not in gate_calibration.json computed first,
# same code as the gate). Scan: summer 2023 in four monthly jobs for M3 false-trigger days. Report: pass rule; commits the result.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  storms:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy scipy pandas requests pygrib pyproj shapely
      - name: HRRR gate boxes for the storms missing from gate_calibration.json
        run: python proto/forecast.py calib --only jul2021b,jul2023b,jul2023c,jul2023d --no-mrms --out /tmp/calib_extra.json 2>&1 | tail -8
      - run: python -u proto/obs_trigger.py storms --calib-extra /tmp/calib_extra.json --out /tmp/storms.json
      - uses: actions/upload-artifact@v4
        with: { name: storms, path: '/tmp/storms.json' }
      - uses: actions/upload-artifact@v4
        with: { name: calib_extra, path: '/tmp/calib_extra.json' }
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        m: [['2023-06-01T00:00Z', '2023-07-01T04:00Z', jun], ['2023-07-01T04:00Z', '2023-08-01T04:00Z', jul], ['2023-08-01T04:00Z', '2023-09-01T04:00Z', aug], ['2023-09-01T04:00Z', '2023-10-01T04:00Z', sep]]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy requests pygrib pyproj
      - run: python -u proto/obs_trigger.py scan --start ${{ matrix.m[0] }} --end ${{ matrix.m[1] }} --out /tmp/scan_${{ matrix.m[2] }}.json --workers 24
      - uses: actions/upload-artifact@v4
        with: { name: 'scan_${{ matrix.m[2] }}', path: '/tmp/scan_${{ matrix.m[2] }}.json' }
  report:
    needs: [storms, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy requests pyproj
      - uses: actions/download-artifact@v4
        with: { path: /tmp/a }
      - run: |
          mkdir -p docs/proto/forecast/obs_trigger
          cp /tmp/a/*/*.json docs/proto/forecast/obs_trigger/
          python proto/obs_trigger.py report --storms docs/proto/forecast/obs_trigger/storms.json --scans docs/proto/forecast/obs_trigger/scan_*.json --out docs/proto/forecast/obs_trigger.json
      - name: commit
        run: |
          git config user.name 'Mohab Eldokla'; git config user.email 'Horus331@users.noreply.github.com'
          git add docs/proto/forecast/obs_trigger.json docs/proto/forecast/obs_trigger; git commit -qm "Observed-rain trigger test: result (as pre-registered)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
