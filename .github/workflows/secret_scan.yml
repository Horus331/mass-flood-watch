name: Secret scan of the full git history (run by hand; prints where, never the value)
on: workflow_dispatch
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Hugging Face / GitHub / generic tokens in any commit of any branch
        run: |
          set +e
          for pat in 'hf_[A-Za-z0-9]{30,}' 'ghp_[A-Za-z0-9]{30,}' 'github_pat_[A-Za-z0-9_]{40,}' 'gho_[A-Za-z0-9]{30,}'; do
            n=$(git log --all -p --no-color -G "$pat" --format='COMMIT %h %ad' --date=short | grep -cE "^\+.*$pat|^-.*$pat")
            echo "pattern ${pat%%[*}: $n line(s) in history"
            git log --all -p --no-color -G "$pat" --format='COMMIT %h %ad' --date=short | grep -E "^COMMIT|^\+\+\+ |^[-+].*$pat" | sed -E "s/$pat/<REDACTED>/g" | grep -B2 REDACTED | grep -E "^COMMIT|^\+\+\+" | head -20
          done
