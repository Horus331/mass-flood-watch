name: NWM soil saturation (SOILSAT_TOP) for the CN antecedent test and the ground state (docs/proto/runoff/NWM_AMC.md)
# proto/runoff/nwm_soilsat.py: probe | storms (-> docs/proto/runoff/nwm_soilsat.json) | clim (-> nwm_soilsat_clim.json) | live (ground_state soil block test)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | storms | clim | live'
        required: true
        default: probe
      args:
        description: 'extra arguments (e.g. clim: --years 1993-2022 --every 1)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  nwm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy pandas requests pyproj netCDF4 matplotlib
      - run: python proto/runoff/nwm_soilsat.py selftest
      - name: run
        run: |
          case "${{ inputs.mode }}" in
            probe|storms|clim) python proto/runoff/nwm_soilsat.py ${{ inputs.mode }} ${{ inputs.args }} 2>&1 | tail -200 ;;
            live) python proto/ground_state.py run --out ground_test.json 2>&1 | tail -5; python -c "import json; d=json.load(open('ground_test.json')); print(json.dumps({k: d[k] for k in d if k != 'frost'}, indent=1)[:4000])" ;;
          esac
      - name: commit
        if: inputs.mode == 'storms' || inputs.mode == 'clim'
        run: |
          git config user.name 'github-actions'; git config user.email 'actions@github.com'
          git add docs/proto/runoff/nwm_soilsat*.json; git commit -qm "runoff: NWM SOILSAT_TOP (${{ inputs.mode }})" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 30 + 5)); done
