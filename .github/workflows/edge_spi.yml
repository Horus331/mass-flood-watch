name: Road-edge stream-power index (1 m lidar, Paper 2 RQ1)
on:
  workflow_dispatch:
    inputs:
      box: {description: 'x0,y0,x1,y1 EPSG:26986 (core area)', default: '171400,913700,183100,925000'}
      town: {description: 'town filter on segments', default: 'LEOMINSTER'}
      name: {description: 'output name', default: 'leominster'}
      segments: {description: "segments file, or 'graph' for the full District road graph", default: 'docs/proto/phase1/parametric_t2/t2_base/segments.geojson'}
permissions:
  contents: write
jobs:
  spi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy scipy requests pyproj tifffile pysheds affine
      - run: python proto/edge_spi.py --box "${{ inputs.box }}" --town "${{ inputs.town }}" --segments "${{ inputs.segments }}" --out papers/paper2/edge_spi_${{ inputs.name }}.json --cache /tmp/dem
      # Paper outputs never go into this public repository (Mo, 24 Nov 2026): they go to the private papers repository
      # when the PAPERS_TOKEN secret exists (fine-grained, contents read/write on Horus331/mass-flood-watch-papers only),
      # otherwise they stay as a run artifact.
      - name: send to the private papers repository
        env: { T: "${{ secrets.PAPERS_TOKEN }}" }
        run: |
          if [ -z "$T" ]; then echo "PAPERS_TOKEN not set: output kept as artifact only"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:$T@github.com/Horus331/mass-flood-watch-papers.git" /tmp/pp
          mkdir -p /tmp/pp/papers/paper2 && cp papers/paper2/edge_spi_${{ inputs.name }}.json /tmp/pp/papers/paper2/
          cd /tmp/pp && git config user.name 'Mohab Eldokla' && git config user.email 'Horus331@users.noreply.github.com'
          git add -A && git commit -qm "edge SPI ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
      - uses: actions/upload-artifact@v4
        with: { name: 'edge_spi_${{ inputs.name }}', path: 'papers/paper2/edge_spi_${{ inputs.name }}.json' }
