name: MassDOT roadway events logger
on:
  schedule: [{cron: '7,22,37,52 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: events_log, cancel-in-progress: false}
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python proto/events_logger.py
      - run: |
          git config user.name 'github-actions'; git config user.email 'actions@github.com'
          git add docs/proto/obs/massdot_events && git commit -qm "MassDOT events log" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 7; done
