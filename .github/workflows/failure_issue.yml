name: Open an Issue when a live workflow fails
# One open Issue per failing workflow (title "Failing: <name>"); later failures add a comment; the next success closes it.
on:
  workflow_run:
    workflows:
      - 'Sentinel (storm state QUIET / WATCH / ACTIVE, District 3)'
      - 'forecast (HRRR rain -> gate -> LISFLOOD-FP -> road closures, District 3)'
      - 'Live feeds, District 3 (MRMS rain + nowcast + FLASH, NWM at culverts, SNODAS, validation reports)'
      - 'Keeper (re-runs the live feeds and the forecast when GitHub''s schedule skips them)'
      - 'storm archive follow-up (labels, radar-driven run, forecast verification)'
    types: [completed]
permissions:
  issues: write
  actions: read
jobs:
  issue:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          CONC: ${{ github.event.workflow_run.conclusion }}
          WHEN: ${{ github.event.workflow_run.updated_at }}
        run: |
          T="Failing: $NAME"
          N=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq "[.[] | select(.pull_request == null and .title == \"$T\")][0].number // empty")
          if [ "$CONC" = failure ]; then
            if [ -n "$N" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="Failed again $WHEN: $URL" > /dev/null
            else gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$T" -f body="The workflow **$NAME** failed at $WHEN.

          Run: $URL

          Opened automatically (.github/workflows/failure_issue.yml). It closes itself on the next successful run. What to check: docs/RUNBOOK.md." > /dev/null; fi
          elif [ -n "$N" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="Recovered: succeeded $WHEN ($URL). Closing." > /dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$N" -f state=closed > /dev/null
          fi
