name: forecast (HRRR rain -> gate -> LISFLOOD-FP -> road closures, District 3)
# Every 6 h, after the 00/06/12/18z HRRR 48 h run is on AWS (~1 h 45 min after issue): the gate reads the forecast rain over District 3 and
# only when a town's 6 h / 24 h maximum reaches the thresholds (proto/forecast.py, docs/proto/forecast/GATE.md) runs the flood model on up to
# four 20 x 20 km boxes around the heaviest rain (20 m, CPU, the validated prototype set-up), then proto/prototype.py and the viewer packs.
# Publishes docs/site/data/forecast_status.json (always) and docs/site/data/forecast_latest[_bN]/ (only when the model ran; overwritten).
# ENSEMBLE (default on; repository variable FORECAST_ENSEMBLE=0 or input ensemble=0 = the old single-cycle run): when the gate fires, the flood
# model runs for the 8 time-lagged HRRR members (this cycle, the 6/12/18 h older 48 h cycles, the 1-4 h older hourly cycles) on every box
# (boxes deduplicated across the members' own gates), one matrix job each; a road is 'likely closed' when >= 2 of the 8 runs close it and
# 'possible' at 1 of 8 (proto/forecast_kofn.py, docs/proto/forecast/ENSEMBLE.md).  The replay shows the issue cycle's run per box.
# STORM ARCHIVE (proto/storm_archive.py, docs/proto/archive/README.md): every cycle also checks api.weather.gov for Flash Flood Warnings / Flood
# Advisories touching a District 3 town; when the gate fires or such an alert exists, the cycle's forecast is kept under docs/proto/archive/
# (in the same commit) and .github/workflows/archive_followup.yml later adds labels, the radar-driven run and the verification.
# WEEK OUTLOOK (proto/outlook.py, docs/proto/forecast/OUTLOOK.md): a parallel job fetches the 7-day rain (NBM, fallback GFS), the WPC Excessive
# Rainfall Outlook and the NWS alerts for District 3; publish writes docs/site/data/outlook.json (<prefix>_outlook.json for test prefixes) in the
# same commit as the status.  Rain/risk only: the flood model still runs only on the 48 h HRRR.  Never fails the forecast.
on:
  schedule:
    - cron: '40 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      init: {description: 'HRRR cycle YYYY-MM-DDTHHZ (empty = latest 48 h cycle)', default: ''}
      force: {description: 'run the flood model even when the gate is quiet', type: boolean, default: false}
      hours: {description: 'forecast hours to use (empty = whole cycle)', default: ''}
      publish: {description: 'commit the result to docs/site/data', type: boolean, default: true}
      ensemble: {description: '1 = 8-member time-lagged ensemble, 0 = single cycle (empty = repository variable FORECAST_ENSEMBLE, default 1)', default: ''}
      prefix: {description: 'site data key (forecast_latest = live; anything else is a test and writes <prefix>_status.json instead of the live status)', default: 'forecast_latest'}
      max_boxes: {description: 'maximum boxes (empty = 4)', default: ''}
      archive_root: {description: 'storm archive folder (empty = docs/proto/archive for the live prefix, no archive for test prefixes)', default: ''}
      alerts_window: {description: 'NWS alert period START/END (UTC ISO) from the IEM archive instead of the live API (tests)', default: ''}
permissions:
  contents: write
concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trigger: ${{ steps.g.outputs.trigger }}
      boxes: ${{ steps.g.outputs.boxes }}
      init: ${{ steps.g.outputs.init }}
      hours: ${{ steps.g.outputs.hours }}
      jobs: ${{ steps.g.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy scipy pandas requests pygrib pyproj matplotlib shapely
      - id: g
        name: forecast rain over District 3, the gate, and the ensemble members / boxes
        env:
          ENSEMBLE: ${{ inputs.ensemble || vars.FORECAST_ENSEMBLE || '1' }}
          FORECAST_MAX_BOXES: ${{ inputs.max_boxes || '4' }}
        run: |
          set -o pipefail
          python proto/forecast.py gate ${{ inputs.init && format('--init {0}', inputs.init) || '' }} ${{ inputs.hours && format('--hours {0}', inputs.hours) || '' }} \
            ${{ inputs.force && '--force' || '' }} --out gate/gate.json --github-output $GITHUB_OUTPUT 2>&1 | tee gate.log
          SINGLE=""; if [ "$ENSEMBLE" = "0" ]; then SINGLE=--single; fi
          python proto/forecast_kofn.py members --gate gate/gate.json $SINGLE --github-output $GITHUB_OUTPUT 2>&1 | tee -a gate.log
          echo "::notice title=gate::$(cut -c1-300 gate.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - name: NWS flood alerts touching District 3 (storm archive trigger; never fails the forecast)
        continue-on-error: true
        run: python proto/storm_archive.py alerts --out gate/alerts.json ${{ inputs.alerts_window && format('--window {0}', inputs.alerts_window) || '' }} 2>&1 | tail -4
      - name: flood reports in District 3 since the previous cycle (LSR, MassDOT log; archives storms the gate and the NWS missed; live only)
        if: inputs.alerts_window == '' || inputs.alerts_window == null
        continue-on-error: true
        run: python proto/storm_archive.py reports --out gate/reports.json 2>&1 | tail -3
      - uses: actions/upload-artifact@v4
        with: {name: gate, path: gate}
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy requests pygrib pyproj matplotlib shapely
      - name: 7-day rain (NBM / GFS), WPC Excessive Rainfall Outlook, NWS alerts over District 3
        run: python proto/outlook.py fetch --out outlook/raw.json
      - uses: actions/upload-artifact@v4
        with: {name: outlook, path: outlook, if-no-files-found: ignore}
  flood:
    needs: gate
    if: needs.gate.outputs.trigger == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        b: ${{ fromJSON(needs.gate.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q cmake libnetcdf-dev netcdf-bin libnuma-dev
      - run: pip install -q numpy scipy pandas requests pygrib pyproj pillow huggingface_hub matplotlib netCDF4 shapely
      - name: flood depth (LISFLOOD-FP 8.2, CPU, HRRR rain)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LF_WORK: ${{ runner.temp }}/lf
          LF_NO_UPLOAD: '1'
          BOX: ${{ matrix.b.box }}
          RES: '20'
          STORM: forecast
          RUN_DIR: runs/forecast_${{ matrix.b.m }}_${{ matrix.b.id }}
          LF_RAIN: hrrr
          LF_HRRR_INIT: ${{ matrix.b.init }}
          LF_HRRR_HOURS: ${{ needs.gate.outputs.hours }}
          LF_ALLOW_DRY: '1'
          LF_HRRR_NBHD: '20,90'     # neighbourhood 20 km / 90th percentile per hour: the best hindcast set-up (docs/proto/forecast/HINDCAST.md)
          LF_LOSS: cn
          LF_CN_AMC: II
          LF_CN_SCALE: '0.88'       # clean parity baseline (docs/proto/parity/BASELINE.md, docs/proto/STATUS.md)
          LF_PARITY: '1'            # infiltration in the rain + steps <= 1 s; ~2x LISFLOOD time, well inside the 330 min job limit
          LF_INFIL_MMH: '2'
          LF_QOUT: '1'
          GIT_SHA: ${{ github.sha }}
          OMP_NUM_THREADS: '4'
        run: |
          set -o pipefail
          /usr/bin/time -v python sim/colab/w9_lisflood.py 2>&1 | tee w9_stdout.txt
      - name: road closures
        run: |
          set -o pipefail
          OUTDIR=$(ls -d ${{ runner.temp }}/lf/run_*/out | head -1)
          P=${{ runner.temp }}/proto_${{ matrix.b.m }}_${{ matrix.b.id }}
          python proto/prototype.py --run-dir $OUTDIR --out $P --storm forecast 2>&1 | tee -a w9_stdout.txt | tail -5
          python proto/resilience.py --out $P || true
          python proto/risk.py --out $P --run-dir $OUTDIR || true
          cp $OUTDIR/meta.json $P/flood_meta.json; tail -c 100000 w9_stdout.txt > $P/w9_stdout.txt
          mkdir -p art && cp -r $P art/
      - name: diagnostics (annotation)
        if: always()
        run: |
          f() { [ -f "$1" ] && { grep -E "$2" "$1" | tail -n ${3:-12}; echo ...; tail -n 15 "$1"; } | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::notice title=w9::$(f w9_stdout.txt 'rain:|HRRR|grid |LISFLOOD-FP run|peak wet|effective|Error|error|Traceback|Elapsed|Maximum resident')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'proto_${{ matrix.b.m }}_${{ matrix.b.id }}', path: art, if-no-files-found: ignore}
  publish:
    needs: [gate, flood, outlook]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy pandas pillow shapely scipy requests pygrib pyproj matplotlib
      - uses: actions/download-artifact@v4
        with: {path: arts}
      - name: viewer packs + forecast_status.json
        env:
          PFX: ${{ inputs.prefix || 'forecast_latest' }}
        run: |
          ls arts | head -60
          ST=docs/site/data/forecast_status.json; [ "$PFX" = "forecast_latest" ] || ST=docs/site/data/${PFX}_status.json
          rm -rf docs/site/data/${PFX} docs/site/data/${PFX}_b*
          # members: arts/proto_<DDHH>_<box>/proto_<DDHH>_<box>/ -> --member <init>:<box>=<dir> (every job of the matrix, finished or not)
          MEM=$(python proto/forecast_kofn.py memberargs --gate arts/gate/gate.json --arts arts)
          RUNS=""; KOFN=""
          if [ -n "$MEM" ]; then
            python proto/forecast_kofn.py ensemble --gate arts/gate/gate.json $MEM --out kofn.json --viewers viewers.txt --prefix $PFX
            NM=$(python -c "import json; print(len(json.load(open('arts/gate/gate.json'))['ensemble']['members']))")
            if [ "$NM" -gt 1 ]; then KOFN="--kofn kofn.json"; fi
            while read key dir box m; do
              python docs/site/build_data.py --run $key --src $(realpath $dir) || continue
              if [ -n "$KOFN" ]; then python proto/forecast_kofn.py pack --kofn kofn.json --key $key --box $box; fi
              RUNS="$RUNS --run $key=$(realpath $dir)"
            done < viewers.txt
          fi
          python proto/forecast.py status --gate arts/gate/gate.json $RUNS $KOFN --out $ST
          head -c 1500 $ST; echo
          du -sh docs/site/data/${PFX}* || true
      - name: 7-day storm outlook (outlook.json beside the status, same commit; a missing fetch is written as status failed)
        continue-on-error: true
        env:
          PFX: ${{ inputs.prefix || 'forecast_latest' }}
        run: |
          ST=docs/site/data/forecast_status.json; OL=docs/site/data/outlook.json
          [ "$PFX" = "forecast_latest" ] || { ST=docs/site/data/${PFX}_status.json; OL=docs/site/data/${PFX}_outlook.json; }
          python proto/outlook.py build --raw arts/outlook/raw.json --status $ST --prev $OL --out $OL 2>&1 | tee outlook.log
          echo "::notice title=outlook::$(cut -c1-200 outlook.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - name: ground state (5-day rain wetness + frozen-ground index; context only, proto/ground_state.py)
        if: (inputs.prefix || 'forecast_latest') == 'forecast_latest'
        continue-on-error: true
        run: |
          pip install -q netCDF4 || true     # NWM soil saturation block ('soil', proto/runoff/nwm_soilsat.py live)
          python proto/ground_state.py run --out docs/site/data/ground.json 2>&1 | tail -3
      - name: storm archive (gate fired or NWS flood alert in District 3; quiet cycles write nothing)
        continue-on-error: true
        env:
          PFX: ${{ inputs.prefix || 'forecast_latest' }}
          AR: ${{ inputs.archive_root }}
        run: |
          R="$AR"; [ -z "$R" ] && [ "$PFX" = "forecast_latest" ] && R=docs/proto/archive
          [ -n "$R" ] || { echo "test prefix without archive_root: not archiving"; exit 0; }
          ST=docs/site/data/forecast_status.json; [ "$PFX" = "forecast_latest" ] || ST=docs/site/data/${PFX}_status.json
          K=""; [ -f kofn.json ] && K="--kofn kofn.json"
          RP=""; [ -f arts/gate/reports.json ] && RP="--reports arts/gate/reports.json"
          python proto/storm_archive.py archive --gate arts/gate/gate.json --alerts arts/gate/alerts.json $RP --status $ST $K --root $R --flag archived.txt
          if [ -f archived.txt ]; then echo "AROOT=$R" >> $GITHUB_ENV; fi     # ARCHIVE.md is rebuilt by archive_followup.yml (one writer, no rebase conflicts)
      - name: forward-test ledger (live cycles only; one row per cycle, quiet ones too; docs/proto/prospective/PROSPECTIVE.md)
        if: (inputs.prefix || 'forecast_latest') == 'forecast_latest'
        continue-on-error: true
        env:
          GIT_SHA: ${{ github.sha }}
          ENS: ${{ inputs.ensemble || vars.FORECAST_ENSEMBLE || '1' }}
        run: |
          K=""; [ -f kofn.json ] && K="--kofn kofn.json"
          python proto/storm_archive.py ledger --gate arts/gate/gate.json --status docs/site/data/forecast_status.json --alerts arts/gate/alerts.json \
            --reports arts/gate/reports.json $K --flag archived.txt --settings "ensemble=$ENS nbhd=20,90 cn=0.88 parity=1 infil=2 res=20"
      - name: commit
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git config user.name 'flood-watch-bot'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/site/data; [ -n "$AROOT" ] && git add -A "$AROOT"; [ -d docs/proto/prospective ] && git add -A docs/proto/prospective
          git diff --cached --quiet && { echo "no change"; exit 0; }
          P=${{ inputs.prefix || 'forecast_latest' }}; ST=docs/site/data/forecast_status.json; [ "$P" = "forecast_latest" ] || ST=docs/site/data/${P}_status.json
          git commit -qm "Forecast $P $(python -c "import json;s=json.load(open('$ST'));print(s['issued'], s['state'], s['likely_closed'], 'segments')")$([ -f archived.txt ] && echo " + archived storm $(cat archived.txt)")"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
