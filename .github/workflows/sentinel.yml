name: Sentinel (storm state QUIET / WATCH / ACTIVE, District 3)
# proto/sentinel.py every ~10 min: NWS alerts, MRMS radar 1 h rain, newest HRRR cycle, freshness of the other feeds -> docs/site/data/status.json.
# Light (about 1 min). Commits only when the state changes, else hourly (QUIET) or every 15 min (WATCH / ACTIVE). Starts no model run.
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: sentinel, cancel-in-progress: false}
jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -q numpy pandas requests pygrib pyproj shapely
      - run: python proto/sentinel.py selftest
      - id: s
        run: timeout 300 python -u proto/sentinel.py run --github-output "$GITHUB_OUTPUT"
      - name: commit
        if: always() && steps.s.outputs.commit == 'true'
        run: |
          git config user.name "Mohab Eldokla"; git config user.email "Horus331@users.noreply.github.com"
          git add docs/site/data/status.json; git commit -qm "Sentinel: ${{ steps.s.outputs.state }}${{ steps.s.outputs.changed == 'true' && ' (changed)' || '' }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 10; done; exit 1
