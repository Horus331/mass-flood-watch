name: Test map screenshots (desktop 3 zooms + phone), for Mo's review before the root switch
on:
  workflow_dispatch:
    inputs:
      page: {description: 'page to shoot (next.html = test page, index.html = live map)', default: 'next.html'}
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: npm i -s playwright@1.47.2 http-server@14.1.1 && npx playwright install --with-deps chromium >/dev/null
      - run: |
          npx http-server docs -p 8080 -s -c-1 &
          sleep 3
          PAGE=${{ inputs.page || 'next.html' }} timeout 1500 node proto/bench/ci_shots.js http://localhost:8080 /tmp/shots || true
          ls -la /tmp/shots
      - name: commit to branch test-shots (not deployed)
        run: |
          mkdir /tmp/br && cd /tmp/br && git init -q -b test-shots && cp -r /tmp/shots shots
          git config user.name 'Mohab Eldokla'; git config user.email 'Horus331@users.noreply.github.com'
          git add -A && git commit -qm "test page screenshots" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-shots
