name: FIM flood maps -> v2 site (tiles + roads), run by hand after fim.yml
on:
  workflow_dispatch:
    inputs:
      storms:
        description: comma list
        default: jul2023,sep2023,dec2023,jan2024
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q rasterio numpy pandas pillow pyproj requests huggingface_hub h5py pmtiles mercantile
      - run: sudo mkdir -p /content && sudo chmod 777 /content
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STORMS: ${{ inputs.storms }}
        run: python sim/fim_publish.py
