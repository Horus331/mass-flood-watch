name: HRRR forecast replay of the segment models (runs when the replay inputs change)
on:
  push:
    branches: [main]
    paths: ["refresh/replay/**", "refresh/hrrr_replay.py", ".github/workflows/replay.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: replay
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: refresh/requirements-graph.txt
      - run: pip install -r refresh/requirements.txt && pip install -r refresh/requirements-graph.txt
      - name: Replay the test storms with the HRRR forecast
        run: python refresh/hrrr_replay.py
      - name: Commit the scores
        if: always()
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graph_replay_hrrr.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "HRRR forecast replay of the segment models $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep $((i*7)); done
