name: Drainage network (run by hand)
on:
  workflow_dispatch:
    inputs:
      res:
        description: "Cell size in metres"
        default: "50"
permissions:
  contents: write
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      DRAIN_RES: ${{ github.event.inputs.res || '50' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy requests tifffile pillow pysheds affine
      - run: python sim/drainage.py
      - name: Commit
        run: |
          git config user.name "flood-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/drain
          git diff --cached --quiet && exit 0
          git commit -m "Drainage network $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in $(seq 1 15); do git pull --rebase -q origin main && git push && break; sleep $((RANDOM % 20 + i * 3)); done
