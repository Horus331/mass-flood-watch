name: Probe data sources (run by hand)
# On the terrain-fix branch: District 3 forecast rain-volume diagnostic (proto/forecast_volcal.py, docs/proto/forecast/DISTRICT_VOLCAL_PREREG.md).
# Commits its JSON to this branch (artifacts cannot be read back from where the analysis runs).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy scipy pandas requests pygrib pyproj pillow huggingface_hub netCDF4
      - name: rain volume per setting vs MRMS (District 3 domain)
        env:
          LF_WORK: ${{ runner.temp }}/lf
        run: |
          mkdir -p docs/proto/forecast/district $LF_WORK
          python proto/forecast_volcal.py rain --out docs/proto/forecast/district/volcal_rain.json 2>&1 | tail -60
          python proto/forecast_volcal.py decide --rain docs/proto/forecast/district/volcal_rain.json --out docs/proto/forecast/district/volcal_decision.json | tail -80
      - name: commit
        if: always()
        run: |
          git config user.name 'github-actions'; git config user.email 'actions@github.com'
          git add docs/proto/forecast/district/volcal_*.json; git commit -qm "volcal rain diagnostic" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 30 + 5)); done
