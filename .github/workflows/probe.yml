name: Probe data sources (run by hand)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: USGS STN high-water marks
        run: |
          for u in "https://stn.wim.usgs.gov/STNServices/Events.json" "https://stn.wim.usgs.gov/STNServices/Events?format=json" "https://stn.wim.usgs.gov/STNServices/Events" "https://stn.wim.usgs.gov/STNServices/HWMs/FilteredHWMs.json?States=MA" "https://stn.wim.usgs.gov/STNServices/HWMs.json?States=MA"; do echo "== $u"; curl -s -m 60 -H 'Accept: application/json' "$u" -o out.txt -w "%{http_code} %{content_type} %{size_download}\n"; head -c 400 out.txt; echo; done
      - name: Soils via SDA (hydrologic group polygons for one tile)
        run: |
          curl -s -m 120 -X POST https://sdmdataaccess.sc.egov.usda.gov/tabular/post.rest -H 'Content-Type: application/json' -d '{"format":"JSON","query":"SELECT TOP 3 m.mukey, a.hydgrpdcd, mp.mupolygongeo.STAsText() AS wkt FROM mapunit m JOIN muaggatt a ON a.mukey=m.mukey JOIN mupolygon mp ON mp.mukey=m.mukey WHERE mp.mupolygongeo.STIntersects(geometry::STGeomFromText(\"POLYGON((-71.80 42.50,-71.70 42.50,-71.70 42.56,-71.80 42.56,-71.80 42.50))\",4326))=1"}' | head -c 600; echo
