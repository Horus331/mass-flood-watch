name: storm catalogue (MA flood reports; observed data per catalogued storm)
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'discover (all MA flood LSR + Storm Events rows) or fetch (obs for each storm in catalog.json)', default: 'discover'}
      years: {default: '2014-2026'}
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python proto/obs_catalog.py ${{ inputs.mode }} --years ${{ inputs.years }} 2>&1 | tail -150
      - run: |
          git config user.name 'github-actions'; git config user.email 'actions@github.com'
          git add docs/proto/obs && git commit -qm "storm catalogue: ${{ inputs.mode }}" || echo nothing
          git pull --rebase -q && git push
