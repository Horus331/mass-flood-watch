name: Aerial tiles for the map (MassGIS 2023, District 3, z8-16)
# Tiles go to the orphan branch aerial-tiles of this repository (never deployed from here); they are copied to the data site
# (Horus331/mfw-data-d3, GitHub Pages) under aerial/.
on:
  workflow_dispatch:
    inputs:
      zmax: { description: 'highest zoom', default: '16' }
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: proto/tiles }
      - run: pip install -q pillow
      - run: python proto/tiles/aerial_tiles.py /tmp/aerial --zmax ${{ inputs.zmax }} --workers 12
      - run: du -sh /tmp/aerial; find /tmp/aerial -name '*.webp' | wc -l
      - name: commit to branch aerial-tiles
        run: |
          mkdir /tmp/br && cd /tmp/br && git init -q -b aerial-tiles && mv /tmp/aerial aerial
          git config user.name 'Mohab Eldokla'; git config user.email 'Horus331@users.noreply.github.com'
          git add -A && git commit -qm "Aerial tiles: MassGIS 2023 orthos, District 3 box, z8-${{ inputs.zmax }} (WebP)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" aerial-tiles
